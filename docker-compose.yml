services:
  mcprelay:
    build:
      context: .
      dockerfile: Dockerfile
    image: zeromcp/relay:local
    container_name: mcprelay
    ports:
      - "${MCPRELAY_PORT:-8080}:8080"
    environment:
      # dev  -> config UI enabled at /ui
      # prod -> config UI disabled (default)
      MCPRELAY_MODE: ${MCPRELAY_MODE:-prod}
    volumes:
      # Put relay.config.json in ./config (a directory mount keeps the UI's
      # atomic config saves working in dev mode).
      - ./config:/config
    healthcheck:
      # The aspnet base image ships no curl/wget; use the bash /dev/tcp builtin.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
